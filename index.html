<script>
(() => {
  const $ = id => document.getElementById(id);
  const tronc=$('tronc'), pageG=$('pageG'), pageD=$('pageD'), feuillage=$('feuillage'),
        pied=$('racinesPied'), racineG=$('racineG'), racineD=$('racineD'), pleines=$('racinesPleines'), logo=$('logo'), l1=$('ligne1'), l2=$('ligne2'), tout=$('tout');

  // Courbes d'accélération
  const clamp = t => Math.min(1, Math.max(0, t));
  const outCubic = t => 1 - Math.pow(1 - t, 3);
  const inOutCubic = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  const outBack = t => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
  // progression d'une étape entre a et b (secondes)
  const p = (t, a, b, ease) => ease(clamp((t - a) / (b - a)));

  // Constantes du dessin
  const POUSSEE = -274.36;       // décalage du logo vers la gauche (étape 8)
  const CX = 9143.5;             // axe central du logo
  const DUREE = 9.9;

  // Version 2 : 5 combinaisons de couleurs, jouées l'une après l'autre
  const COMBOS = [
    { fond: '#054b3c', trait: '#ffebd7' },  // 1. vert / crème
    { fond: '#192341', trait: '#ffaf5f' },  // 2. bleu nuit / orange
    { fond: '#ffebd7', trait: '#192341' },  // 3. crème / bleu nuit
    { fond: '#003caa', trait: '#ffebd7' },  // 4. bleu / crème
    { fond: '#e65f5a', trait: '#192341' },  // 5. corail / bleu nuit
  ];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const melange = (h1, h2, k) => {
    const a = hex(h1), b = hex(h2);
    return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(',')})`;
  };
  const racine = document.documentElement.style;
  function couleurs(c, t) {
    const actuel = COMBOS[c % 5], suivant = COMBOS[(c + 1) % 5];
    // le logo est invisible à ce moment-là : le fond glisse vers la couleur suivante
    const k = p(t, 9.45, 9.9, inOutCubic);
    racine.setProperty('--fond', k > 0 ? melange(actuel.fond, suivant.fond, k) : actuel.fond);
    racine.setProperty('--trait', actuel.trait);
  }            // durée d'une boucle complète (s)

  function rendu(t) {
    // 1 → 4 : le tronc sort du sol
    //   Tronc et racines forment un seul mouvement continu (une seule courbe
    //   d'accélération), pour qu'il n'y ait aucune pause entre les deux.
    const w = p(t, 0.5, 3.5, inOutCubic);
    const a = clamp(w / 0.52);
    tronc.setAttribute('transform', `translate(0 ${(1 - a) * 96})`);

    // 5 : formation des racines, juste après le tronc (storyboard Fichier_1)
    //   Un seul mouvement continu : le pied du tronc descend, puis, sans pause,
    //   les racines s'allongent vers les deux extrémités, bouts arrondis.
    pied.setAttribute('height', clamp((w - 0.5) / 0.1) * 31);
    const r = clamp((w - 0.58) / 0.42);
    for (const rac of [racineG, racineD]) {
      rac.setAttribute('stroke-dasharray', `${r} 2`);
      rac.style.opacity = r > 0 ? 1 : 0;
    }
    // le pied s'élargit au rythme des racines pour couvrir la jonction (pas d'encoches)
    const hw = 5.3 + clamp(r / 0.12) * 7.5;
    pied.setAttribute('x', CX - hw);
    pied.setAttribute('width', 2 * hw);
    pleines.setAttribute('opacity', clamp((r - 0.9) / 0.1));  // fondu doux vers la forme exacte

    // 6 : pendant la formation des racines, le feuillage apparaît par un fondu rapide
    feuillage.style.opacity = p(t, 2.4, 2.75, outCubic);

    // 6 : les deux pages du livre sortent du sol, en même temps que le feuillage
    const g = p(t, 2.4, 3.5, outCubic), d = g;
    pageG.setAttribute('transform', `translate(0 ${(1 - g) * 105})`);
    pageD.setAttribute('transform', `translate(0 ${(1 - d) * 105})`);

    // 8 : le logo glisse à gauche, le nom apparaît
    const m = p(t, 3.9, 5.3, inOutCubic);
    logo.setAttribute('transform', `translate(${m * POUSSEE} 0)`);
    const n1 = p(t, 4.65, 5.8, outCubic), n2 = p(t, 4.8, 5.95, outCubic);
    l1.setAttribute('transform', `translate(${(1 - n1) * 60} 0)`); l1.style.opacity = n1;
    l2.setAttribute('transform', `translate(${(1 - n2) * 60} 0)`); l2.style.opacity = n2;

    // Fin de boucle : fondu, puis on recommence
    tout.style.opacity = 1 - p(t, 8.7, 9.5, inOutCubic);
  }

  const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const params = new URLSearchParams(location.search);
  const comboFixe = params.get('c');   // ?c=1 à 5 : affiche une seule combinaison
  if (reduit) { couleurs((comboFixe || 1) - 1, 0); rendu(8); return; }

  // ?t=7.5 dans l'URL fige l'animation à un instant (pratique pour vérifier)
  // ?t=7.5 fige l'animation à un instant (avec ?c=2 pour choisir la couleur)
  const fige = params.get('t');
  if (fige !== null) { const tf = parseFloat(fige); couleurs((comboFixe || 1) - 1, tf); rendu(tf); return; }

  let debut = null;
  function boucle(ms) {
    if (debut === null) debut = ms;
    const e = (ms - debut) / 1000;
    const t = e % DUREE;
    const c = comboFixe ? comboFixe - 1 : Math.floor(e / DUREE) % 5;
    couleurs(c, comboFixe ? 0 : t);
    rendu(t);
    requestAnimationFrame(boucle);
  }
  couleurs(comboFixe ? comboFixe - 1 : 0, 0);
  rendu(0);
  requestAnimationFrame(boucle);
})();
</script>
